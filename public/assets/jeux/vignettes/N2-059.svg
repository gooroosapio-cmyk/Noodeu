<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img"><title>Le curseur juste</title><desc>Illustration de catalogue. Les règles et l’état de jeu sont fournis séparément ; aucun bouton dessiné n’est un contrôle.</desc><rect x="0" y="0" width="720" height="420" rx="28" fill="#FFF9F2" stroke="none" stroke-width="2"/><circle cx="638" cy="80" r="65" fill="#F4D57A" stroke="none" stroke-width="2"/><circle cx="74" cy="350" r="66" fill="#F4D57A" stroke="none" stroke-width="2"/><rect x="52" y="32" width="616" height="348" rx="26" fill="#FFFFFF" stroke="none" stroke-width="2"/><rect x="64" y="42" width="592" height="326" rx="21" fill="#FFFCF8" stroke="none" stroke-width="2"/><g transform="translate(156 45) scale(1.25)"><text xmlns="http://www.w3.org/2000/svg" x="25" y="35" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#362C3B">Retrouve la position du repère.</text><path xmlns="http://www.w3.org/2000/svg" d="M25,120 L295,120" fill="none" stroke="#663C59" stroke-width="6" stroke-linecap="round" /><circle xmlns="http://www.w3.org/2000/svg" cx="195" cy="120" r="12" fill="#F17868" /><text xmlns="http://www.w3.org/2000/svg" x="20" y="165" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#362C3B">0</text><text xmlns="http://www.w3.org/2000/svg" x="276" y="165" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#362C3B">100</text><text xmlns="http://www.w3.org/2000/svg" x="90" y="205" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#362C3B">Puis confirme ton choix.</text></g></svg>